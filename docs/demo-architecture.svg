<svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowDemo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="620" fill="#FFFFFF"/>

  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#202124">Demo architecture (Cloud Run, single instance)</text>

  <rect x="40" y="56" width="1200" height="524" rx="24" fill="#FAFAFA" stroke="#DADCE0" stroke-width="2"/>
  <text x="62" y="82" font-size="13" font-weight="bold" fill="#5F6368">GCP Project</text>

  <rect x="72" y="270" width="150" height="90" rx="8" fill="#F5F5F5" stroke="#757575" stroke-width="1.5"/>
  <text x="147" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Client</text>
  <text x="147" y="320" text-anchor="middle" font-size="12" fill="#555555">Internal service</text>
  <text x="147" y="335" text-anchor="middle" font-size="12" fill="#555555">caller (checkout /</text>
  <text x="147" y="350" text-anchor="middle" font-size="12" fill="#555555">storefront)</text>

  <rect x="278" y="280" width="170" height="70" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="363" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Cloud Armor</text>
  <text x="363" y="326" text-anchor="middle" font-size="12" fill="#555555">WAF + edge network</text>
  <text x="363" y="340" text-anchor="middle" font-size="12" fill="#555555">security</text>

  <rect x="504" y="100" width="660" height="410" rx="20" fill="#E1F5FE" stroke="#4285F4" stroke-width="2"/>
  <text x="524" y="126" font-size="14" font-weight="bold" fill="#1A73E8">Cloud Run</text>

  <rect x="528" y="140" width="612" height="358" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.5"/>
  <text x="834" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Product Availability Service (Java)</text>
  <text x="834" y="182" text-anchor="middle" font-size="12" fill="#555555">min=1, max=1 instance</text>

  <rect x="558" y="198" width="200" height="56" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="658" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Rate limiter</text>
  <text x="658" y="238" text-anchor="middle" font-size="11" fill="#555555">token bucket per IP</text>

  <rect x="558" y="276" width="200" height="56" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="658" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Controller</text>
  <text x="658" y="316" text-anchor="middle" font-size="11" fill="#555555">input validation</text>

  <rect x="558" y="354" width="200" height="56" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="658" y="377" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Service layer</text>
  <text x="658" y="394" text-anchor="middle" font-size="11" fill="#555555">business logic</text>

  <rect x="820" y="198" width="290" height="120" rx="8" fill="#F5F5F5" stroke="#757575" stroke-width="1.5"/>
  <text x="965" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Data source</text>
  <text x="965" y="258" text-anchor="middle" font-size="12" fill="#555555">In-memory/JSON product</text>
  <text x="965" y="274" text-anchor="middle" font-size="12" fill="#555555">data (10 SKUs)</text>

  <rect x="558" y="432" width="200" height="60" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="658" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">In-process cache</text>
  <text x="658" y="468" text-anchor="middle" font-size="12" fill="#555555">(Caffeine)</text>
  <text x="658" y="483" text-anchor="middle" font-size="11" fill="#555555">TTL 5-10s</text>

  <line x1="658" y1="254" x2="658" y2="276" stroke="#5F6368" stroke-width="2" marker-end="url(#arrowDemo)"/>
  <line x1="658" y1="332" x2="658" y2="354" stroke="#5F6368" stroke-width="2" marker-end="url(#arrowDemo)"/>
  <line x1="658" y1="410" x2="658" y2="432" stroke="#5F6368" stroke-width="2" marker-end="url(#arrowDemo)"/>
  <rect x="616" y="415" width="86" height="16" fill="#FFFFFF"/>
  <text x="658" y="427" text-anchor="middle" font-size="11" fill="#555555">cache check</text>

  <polyline points="758,452 800,452 800,258 820,258" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#arrowDemo)"/>
  <rect x="768" y="410" width="94" height="16" fill="#FFFFFF"/>
  <text x="815" y="422" text-anchor="middle" font-size="11" fill="#555555">cache miss</text>

  <polyline points="222,316 278,316" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#arrowDemo)"/>
  <polyline points="448,316 504,316" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#arrowDemo)"/>
  <rect x="230" y="298" width="42" height="14" fill="#FAFAFA"/>
  <text x="251" y="309" text-anchor="middle" font-size="11" fill="#555555">request</text>

  <polyline points="658,198 658,166 548,166 548,144" fill="none" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="4,3"/>

  <polyline points="504,548 147,548 147,360" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#arrowDemo)"/>
  <rect x="182" y="530" width="220" height="16" fill="#FAFAFA"/>
  <text x="292" y="542" text-anchor="middle" font-size="11" fill="#555555">JSON response (200/400/404/500)</text>

  <rect x="800" y="524" width="340" height="52" rx="8" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="970" y="546" text-anchor="middle" font-size="11.5" fill="#333333">Single instance - no cross-instance cache</text>
  <text x="970" y="562" text-anchor="middle" font-size="11.5" fill="#333333">consistency concern in this demo</text>
  <line x1="970" y1="524" x2="970" y2="510" stroke="#5F6368" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
