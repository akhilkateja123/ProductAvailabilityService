server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: product-availability-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.aritzia.availability: INFO
